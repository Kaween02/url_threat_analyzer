services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-url_threat_analyzer}
      POSTGRES_USER: ${POSTGRES_USER:-url_analyzer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-replace-this-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-url_analyzer} -d ${POSTGRES_DB:-url_threat_analyzer}"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://url_analyzer:replace-this-password@db:5432/url_threat_analyzer}
      JWT_SECRET: ${JWT_SECRET:-replace-this-with-a-long-random-secret}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-60}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - backend
volumes:
  postgres_data:
